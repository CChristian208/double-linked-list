    public void reversePrint()
    {
        Node flow = this.tail;
        for (int i = countNodes() - 1; i >= 0; i--)
        {
            flow.print();
            flow = flow.getPre();
        }
    }

    public void reverseList()
    {
        for (int i = 0; i < countNodes()/2; i++)
        {
            swap2(i, countNodes() - i - 1);
        }
    }

    public void fight(int index1, int index2)
    {
        if (index1 < 0 || index2 < 0 || index1 > countNodes() - 1 || index2 > countNodes() - 1 || index1 == index2) 
        {
            Console.WriteLine("Index out of bound/error.");
        } else
        {
            if (index1 > index2)
                (index1, index2) = (index2, index1);

            this.getNodeByIndex(index1).print();
            this.getNodeByIndex(index2).print();

            if ((this.getNodeByIndex(index1).getPlayer().getSpeed() - (int)this.getNodeByIndex(index2).getPlayer().getStrenght()) <= 0)
            {
                this.getNodeByIndex(index1).getPlayer().setSpeed(0);
            }
            else
            {
                this.getNodeByIndex(index1).getPlayer().setSpeed(this.getNodeByIndex(index1).getPlayer().getSpeed() - (int)this.getNodeByIndex(index2).getPlayer().getStrenght());
            }

            if ((this.getNodeByIndex(index2).getPlayer().getSpeed() - (int)this.getNodeByIndex(index1).getPlayer().getStrenght()) <= 0)
            {
                this.getNodeByIndex(index2).getPlayer().setSpeed(0);
            }
            else
            {
                this.getNodeByIndex(index2).getPlayer().setSpeed(this.getNodeByIndex(index2).getPlayer().getSpeed() - (int)this.getNodeByIndex(index1).getPlayer().getStrenght());
            }

            Console.WriteLine();
            this.getNodeByIndex(index1).print();
            this.getNodeByIndex(index2).print();

            if (this.getNodeByIndex(index2).getPlayer().getSpeed() == 0)
                this.deleteNodeByIndex(index2);

            if (this.getNodeByIndex(index1).getPlayer().getSpeed() == 0)
                this.deleteNodeByIndex(index1);
        }
    }   
