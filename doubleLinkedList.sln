class Player
{
    protected string name;
    protected double strenght;  // 1.0 ÷ 10.0
    protected int speed;        // 1 ÷ 100

    public Player()
    {
        setName(" ");
        setStrenght(0);
        setSpeed(0);
    }

    public Player(string name, object strenght, object speed)
    {
        setName(name);
        setStrenght(strenght);
        setSpeed(speed);
    }

    public void setName(string name)
    {
        while (name.Length > 3)
        {
            Console.Write("Name too long insert it again: ");
            name = Console.ReadLine();
        }
        this.name = name;
    }

    public void setSpeed(object speed)
    {
        while (!(int.TryParse(Convert.ToString(speed), out this.speed) && this.speed >= 0 && this.speed <= 44))
        {
            Console.Write("Insert a correct value of speed(1÷44): ");
            speed = Console.ReadLine();
        }
    }

    public void setStrenght(object strenght)
    {
        while (!(double.TryParse(Convert.ToString(strenght), out this.strenght) && ((this.strenght * 10) / 10) == this.strenght && this.strenght >= 1.0 && this.strenght <= 10.0))
        {
            Console.Write("Insert a correct value of strenght(1÷10): ");
            strenght = Console.ReadLine();
        }
    }

    public string getName() { return this.name; }

    public double getStrenght() { return this.strenght; }

    public int getSpeed() { return this.speed; }

    public override string ToString()
    {
        return $"{this.name,-3} | {this.strenght,4:F1} | {this.speed,2}";
    }

    public override bool Equals(object? obj)
    {
        if (obj == null || obj is not Player)
            return false;
        return this.getName() == ((Player)obj).getName() && Math.Abs(this.strenght - ((Player)obj).getStrenght()) < 0.01 && this.getSpeed() == ((Player)obj).getSpeed();
    }
}
