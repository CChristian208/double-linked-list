int getNInRange(int inf, int sup, string qst)
{
    object x = "";
    int n;
    while(!(int.TryParse(Convert.ToString(x), out n) && n >= inf && n <= sup))
    {
        Console.Write($"{qst} ({inf}÷{sup}): ");
        x = Console.ReadLine();
    }
    return n;
}


// --------------------------------- CLASSES ---------------------------------
class Node
{
    protected Player p;
    protected Node next;
    protected Node pre;

    public Node()
    {
        this.p = new Player();
        this.next = null;
        this.pre = null;
    }

    public Node(object p, object next, object pre)
    {
        setPlayer(p);
        setNext(next);
        setPre(pre);
    }

    public Node(object node)
    {
        if (node is Node)
        {
            setPlayer(((Node)node).getPlayer());
            setNext(((Node)node).getNext());
            setPre(((Node)node).getPre());
        }
        else if (node is Player)
        {
            setPlayer(node);
            setNext(null);
            setPre(null);
        }
        else
        {
            this.p = new Player();
            this.next = null;
            this.pre = null;
        }
    }

    public void setPlayer(object p)
    {
        if (p is Player)
        {
            this.p = (Player)p;
        }
        else
        {
            this.p = new Player();
        }
    }

    public void setNext(object next)
    {
        if (next is Node)
        {
            this.next = (Node)next;
        }
        else
        {
            this.next = null;
        }
    }

    public void setPre(object pre)
    {
        if (pre is Node)
        {
            this.pre = (Node)pre;
        }
        else
        {
            this.pre = null;
        }
    }

    public Player getPlayer() { return this.p; }

    public Node getNext() { return this.next; }

    public Node getPre() { return this.pre; }

    public override string ToString()
    {
        return $"\n[{this.p}] <--> {this.next}";
    }

    public void print()
    {
        Console.WriteLine($"[{this.p}]");
    }
}

class List
{
    protected Node head;
    protected Node tail;

    public List()
    {
        this.head = null;
        this.tail = null;
    }

    public List(object node)
    {
        if (node is Player)
            node = new Node(node);
        this.setHead(node);
        this.setTail(node);
    }

    public void setHead(object node)
    {
        if (node is Node)
        {
            this.head = (Node)node;
        }
        else
        {
            this.head = null;
        }
        this.head.setPre(null);
    }

    public void setTail(object node)
    {
        if (node is Node)
        {
            this.tail = (Node)node;
        }
        else
        {
            this.tail = null;
        }
        this.tail.setNext(null);
    }

    public Node getHead() { return this.head; }

    public Node getTail() { return this.tail; }


    //-----PRINT-----

    public override string ToString()
    {
        return $"null <--> {this.head} null";
    }


    //-----METHODS-----

    static int getNInRange(int inf, int sup, object qst)
    {
        object x = "";
        int n;
        while (!(int.TryParse(Convert.ToString(x), out n) && n >= inf && n <= sup))
        {
            Console.Write($"{qst} ({inf}÷{sup}): ");
            x = Console.ReadLine();
        }
        return n;
    }

    public int countNodes()
    {
        int count = 0;
        for (Node flow = this.head; flow != null; flow = flow.getNext())
        {
            count++;
        }
        return count;
    }

    public void addToHead(object node)
    {
        if (node is Node)
        {
            if (this.head == null)
            {
                this.head = this.tail = (Node)node;
            }
            else
            {
                ((Node)node).setNext(this.head);
                this.head.setPre(node);
                this.setHead(node);
            }
        }
        else if (node is Player)
        {
            addToHead(new Node(node));
        }
        else
        {
            Console.WriteLine("There's nothing i can do.");
        }
    }

    public void addToTail(object node)
    {
        if (node is Node)
        {
            if (this.head == null)
            {
                this.head = this.tail = (Node)node;
            }
            else
            {
                this.tail.setNext(node);
                ((Node)node).setPre(this.tail);
                this.setTail(node);
            }
        }
        else if (node is Player)
        {
            addToTail(new Node(node));
        }
        else
        {
            Console.WriteLine("There's nothing i can do.");
        }
    }

    public void insertNodeInIndex(int index, object node)
    {
        if (node is Node)
        {
            if (index < 0 || index > countNodes())
            {
                Console.WriteLine("Index out of bound.");
            } else
            {
                if (index == 0)
                {
                    addToHead(node);
                } else if (index == countNodes())
                {
                    addToTail(node);
                } else
                {
                    Node flow = this.head;
                    for (int count = 0; count < index; count++)
                    {
                        flow = flow.getNext();
                    }
                    ((Node)node).setNext(flow);
                    ((Node)node).setPre(flow.getPre());
                    flow.getPre().setNext(node);
                    flow.setPre(node);

                    //con count < index - 1
                    //((Node)node).setNext(flow.getNext());
                    //((Node)node).setPre(flow);
                    //flow.getNext().setPre(node);
                    //flow.setNext(node);
                }
            }
        } else if (node is Player)
        {
            insertNodeInIndex(index, new Node(node));
        } else
        {
            Console.WriteLine("There's nothing i can do.");
        }
    }

    public void clearList()
    {
        if (this.head == null)
        {
            Console.WriteLine("Empty list.");
        } else
        {
            this.head = null;
        }
    }

    public void deleteHead()
    {
        if (this.head == null)
        {
            Console.WriteLine("Empty list.");
        } else if (this.head == this.tail)
        {
            clearList();
        } else
        {
            this.setHead(this.head.getNext());
        }
    }

    public void deleteTail()
    {
        if (this.head == null)
        {
            Console.WriteLine("Empty list.");
        }
        else if (this.head == this.tail)
        {
            clearList();
        }
        else
        {
            this.setTail(this.tail.getPre());
        }
    }

    public Node getNodeByIndex(int index)
    {
        if (index < 0 || index > countNodes() - 1)
        {
            Console.WriteLine("Index out of bound.");
            return null;
        } else
        {
            Node flow = this.head;
            for (int count = 0; count < index; count++)
            {
                flow = flow.getNext();
            }
            return flow;
        }
    }

    public void deleteNodeByIndex(int index)
    {
        if (index < 0 || index > countNodes() - 1)
        {
            Console.WriteLine("Index out of bound.");
        } else
        {
            if (this.head == null)
            {
                Console.WriteLine("Empty list.");
            } else if (this.head == this.tail)
            {
                clearList();
            } else if (index == countNodes() - 1)
            {
                deleteTail();
            } else
            {
                Node flow = getNodeByIndex(index);
                flow.getPre().setNext(flow.getNext());
                flow.getNext().setPre(flow.getPre());
            }
        }
    }

    public Node pop(int index)      // estrae ed elimina un nodo
    {
        Node node = getNodeByIndex(index);
        deleteNodeByIndex(index);
        return node;
    }

    public void swap(int index1, int index2)
    {
        if (index1 < 0 || index2 < 0 || index1 > countNodes() - 1 || index2 > countNodes() - 1 || index1 == index2)
        {
            Console.WriteLine("Index out of bound/Error.");
        } else
        {
            if (index1 < index2)
            {
                (index1, index2) = (index2, index1);
            }

            Node temp1 = getNodeByIndex(index1);
            Node temp2 = getNodeByIndex(index2);

            deleteNodeByIndex(index1);
            deleteNodeByIndex(index2);

            insertNodeInIndex(index2, temp1);
            insertNodeInIndex(index1, temp2);
        }
    }

    public void swap2(int index1, int index2)
    {
        if (index1 < 0 || index2 < 0 || index1 > countNodes() - 1 || index2 > countNodes() - 1 || index1 == index2)
        {
            Console.WriteLine("Index out of bound/Error.");
        }
        else
        {
            if (index1 > index2)
                (index1, index2) = (index2, index1);

            insertNodeInIndex(index1, pop(index2));
            if (index1 + 1 != index2)                       // se i nodi sono adiacenti lo scambio è già stato effettuato
                insertNodeInIndex(index2, pop(index1 + 1));
        }
    }

